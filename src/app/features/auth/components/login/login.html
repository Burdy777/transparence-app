<div class="rp-page login-page">
  <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand">
      <div class="logo">
        <img src="logo-transparence.png" alt="Transparence" />
      </div>
      <h1>Espace agent</h1>
      <p class="subtitle">Connectez-vous pour continuer</p>
    </div>

    <app-input-text-form-field
      fieldId="email"
      label="Email"
      type="email"
      labelStyle="static"
      [control]="form.controls.email"
      autocomplete="username"
      placeholder="agent@exemple.com"
      errorMessage="Email valide requis"
    />

    <app-input-text-form-field
      fieldId="password"
      label="Mot de passe"
      type="password"
      labelStyle="static"
      [control]="form.controls.password"
      autocomplete="current-password"
      errorMessage="Mot de passe requis"
    />

    @if (errorMessage()) {
      <p class="rp-form-error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="rp-cta" [disabled]="loading()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
</div>
