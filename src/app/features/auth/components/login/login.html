<div class="rp-page login-page">
  <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand">
      <div class="logo">
        <img src="logo-transparence.png" alt="Transparence" />
      </div>
      <h1>Espace agent</h1>
      <p class="subtitle">Connectez-vous pour continuer</p>
    </div>

    <div class="rp-field">
      <label for="email">Email</label>
      <input
        id="email"
        class="rp-val"
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="agent@exemple.com"
      />
    </div>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">Email valide requis</p>
    }

    <div class="rp-field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        class="rp-val"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </div>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error">Mot de passe requis</p>
    }

    @if (errorMessage()) {
      <p class="rp-form-error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="rp-cta" [disabled]="loading()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
</div>
