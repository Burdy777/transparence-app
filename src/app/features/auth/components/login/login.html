<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Rapports de chantier</h1>
    <p class="subtitle">Connexion agent</p>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="agent@exemple.com" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">Email valide requis</p>
    }

    <label for="password">Mot de passe</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error">Mot de passe requis</p>
    }

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
</div>
