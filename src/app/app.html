@if (auth.currentAgent(); as agent) {
  <!-- Bouton hamburger flottant (plus de toolbar) -->
  <button
    mat-fab
    type="button"
    class="menu-fab"
    (click)="toggleSidenav()"
    aria-label="Ouvrir le menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-sidenav-container class="app-sidenav-container">
    <mat-sidenav
      #drawer
      class="app-sidenav"
      mode="over"
      [opened]="sidenavOpen()"
      (openedChange)="sidenavOpen.set($event)"
    >
      <div class="sidenav-header">
        <mat-icon class="sidenav-avatar">account_circle</mat-icon>
        <div class="sidenav-user">
          <span class="sidenav-user-name">{{ agent.name }}</span>
          <span class="sidenav-user-role">Agent</span>
        </div>
      </div>

      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/nouveau-rapport"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidenav()"
        >
          <mat-icon matListItemIcon>note_add</mat-icon>
          <span matListItemTitle>Nouveau</span>
        </a>
        <a
          mat-list-item
          routerLink="/historique"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidenav()"
        >
          <mat-icon matListItemIcon>history</mat-icon>
          <span matListItemTitle>Historique</span>
        </a>
      </mat-nav-list>

      <div class="sidenav-footer">
        <button mat-list-item type="button" (click)="logout()">
          <mat-icon matListItemIcon>logout</mat-icon>
          <span matListItemTitle>Deconnexion</span>
        </button>
      </div>
    </mat-sidenav>

    <mat-sidenav-content>
      <main>
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <main>
    <router-outlet />
  </main>
}
